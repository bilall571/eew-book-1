<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEW - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1cb0f6; font-weight: 900; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { margin: 0; color: #777; font-size: 16px; }
        .stat-card .value { font-size: 48px; font-weight: 900; color: #1cb0f6; margin: 10px 0; }
        .btn-logout { background: #ff4b4b; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 800; }
        .chart-section { background: white; margin-top: 30px; padding: 25px; border-radius: 20px; }
        .daily-list { list-style: none; padding: 0; margin-top: 20px; }
        .daily-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <script>
        // Xavfsizlik: Agar login qilmagan bo'lsa, haydab yuboramiz
        if (sessionStorage.getItem('admin_access') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="container">
        <header>
            <h1>📊 EEW Dashboard</h1>
            <button class="btn-logout" onclick="logout()">Chiqish</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Hozir Onlayn</h3>
                <div class="value" id="online-count">0</div>
                <p>faol foydalanuvchilar</p>
            </div>
            <div class="stat-card">
                <h3>Jami Tashriflar</h3>
                <div class="value" id="total-count">0</div>
                <p>sayt ochilgandan beri</p>
            </div>
            <div class="stat-card">
                <h3>Bugun</h3>
                <div class="value" id="today-count">0</div>
                <p id="current-date"></p>
            </div>
        </div>

        <div class="chart-section">
            <h3>📅 Kunlik Statistika (Oxirgi 7 kun)</h3>
            <div id="daily-stats-list" class="daily-list">
                <!-- Kunlik ma'lumotlar shu yerga tushadi -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://eew-words-default-rtdb.firebaseio.com", // Bu yer index.html bilan bir xil bo'lishi shart
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('current-date').textContent = today;

        // 1. Onlayn foydalanuvchilar
        onValue(ref(db, 'onlineUsers'), (snapshot) => {
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 0;
            document.getElementById('online-count').textContent = count;

            // Kimlar onlayn ekanini (qurilmasini) ro'yxatda ko'rsatish
            const list = document.getElementById('daily-stats-list'); // Re-using container for demo
            // Bu yerda onlayn foydalanuvchilar ro'yxatini ham chiqarish mumkin
        });

        // 2. Umumiy tashriflar
        onValue(ref(db, 'stats/totalVisits'), (snapshot) => {
            document.getElementById('total-count').textContent = snapshot.val() || 0;
        });

        // 3. Bugungi tashriflar
        onValue(ref(db, `stats/daily/${today}`), (snapshot) => {
            document.getElementById('today-count').textContent = snapshot.val() || 0;
        });

        // 4. Oxirgi kunlar ro'yxati
        onValue(ref(db, 'stats/daily'), (snapshot) => {
            const dailyData = snapshot.val();
            const container = document.getElementById('daily-stats-list');
            container.innerHTML = "";

            if (dailyData) {
                const keys = Object.keys(dailyData).sort().reverse().slice(0, 7);
                keys.forEach(date => {
                    const item = document.createElement('div');
                    item.className = 'daily-item';
                    item.innerHTML = `<span>${date}</span> <strong>${dailyData[date]} kishi</strong>`;
                    container.appendChild(item);
                });
            }
        });

        window.logout = () => {
            sessionStorage.removeItem('admin_access');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
```
